<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="customer_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>customer_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- اسکریپت مربوط به نوتیفیکیشن و Badge وب/PWA -->
  <script>
    window.requestWebNotificationPermission = function() {
      if (!("Notification" in window)) {
        console.log("This browser does not support desktop notification");
        return;
      }
      if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission().then(function (permission) {
          if (permission === "granted") {
            console.log("Web Notification permission granted.");
          }
        });
      }
    };

    window.showWebNotification = function(title, body) {
      if (("Notification" in window) && Notification.permission === "granted") {
        var notification = new Notification(title, {
          body: body,
          icon: "icons/Icon-192.png" // آیکونی که در PWA نمایش داده می‌شود
        });
        
        notification.onclick = function() {
          window.focus();
          this.close();
        };
      }
    };

    // توابع App Badge API برای نمایش/حذف عدد روی آیکون PWA (iOS/Android/Web)
    window.updateWebBadge = function(count) {
      if (navigator.setAppBadge) {
        navigator.setAppBadge(count).catch(function(error) {
          console.error("Error setting app badge:", error);
        });
      }
    };

    window.clearWebBadge = function() {
      if (navigator.clearAppBadge) {
        navigator.clearAppBadge().catch(function(error) {
          console.error("Error clearing app badge:", error);
        });
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
